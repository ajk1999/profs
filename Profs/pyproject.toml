[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "profs"
version = "0.1.0"
description = "University faculty discovery, publication lookup, research summarization, and outreach drafting."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4==4.12.3",
  "jinja2==3.1.6",
  "openai==1.68.2",
  "playwright==1.51.0",
  "PyYAML==6.0.2",
  "requests==2.32.3",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
